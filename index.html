
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #101827, #243b63);
      color: white;
    }

    .container {
      text-align: center;
      padding: 30px;
      width: 90%;
      max-width: 420px;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 12px;
    }

    p {
      color: #d1d5db;
      margin-bottom: 35px;
    }

    .botao {
      display: block;
      width: 100%;
      padding: 22px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      font-size: 26px;
      font-weight: bold;
      border-radius: 15px;
      transition: 0.2s;
    }

    .botao:hover {
      background: #1d4ed8;
      transform: scale(1.04);
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Bem-vindo!</h1>
    <p>Clique no botão para entrar no site.</p>

    <a
      class="botao"
      href="https://httpgetyou.github.io/Group/"
      target="_blank"
      rel="noopener noreferrer"
    >
      ENTRAR →
    </a>
  </main>
</body>
</html>
